# Cloudflare Pages configuration for the Carol Bird site.
#
# This is a SEPARATE Pages project from the main gadd-and-walters one, so
# Carol's site can live on its own subdomain (carol.gadd-walters.co.uk)
# without redeploying the agency site.
#
# Deploy from this folder:
#   cd carolbird && npx wrangler pages deploy . --project-name carolbird
name = "carolbird"
pages_build_output_dir = "."
compatibility_date = "2025-01-01"
